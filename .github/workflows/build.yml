name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build with Gradle
      run: |
        mkdir -p app/src/main/kotlin/com/bench/fps
        mkdir -p app/src/main/res/values
        
        printf "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositories { google(); mavenCentral() } }\nrootProject.name = \"FpsShooter\"\ninclude \":app\"\n" > settings.gradle
        
        printf "plugins {\n    id 'com.android.application' version '8.5.2' apply false\n    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false\n}\n" > build.gradle
        
        printf "org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\nkotlin.code.style=official\n" > gradle.properties
        
        printf "plugins {\n    id 'com.android.application'\n    id 'org.jetbrains.kotlin.android'\n}\nandroid {\n    namespace 'com.bench.fps'\n    compileSdk 34\n    defaultConfig {\n        applicationId \"com.bench.fps\"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName \"1.0\"\n    }\n    buildTypes { release { minifyEnabled false } }\n    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n    kotlinOptions { jvmTarget = '17' }\n}\ndependencies { }\n" > app/build.gradle
        
        printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-feature android:glEsVersion=\"0x00030000\" android:required=\"true\"/>\n    <application android:label=\"FpsShooter\" android:theme=\"@android:style/Theme.NoTitleBar.Fullscreen\" android:hardwareAccelerated=\"true\">\n        <activity android:name=\".MainActivity\" android:screenOrientation=\"landscape\" android:configChanges=\"orientation|screenSize|keyboardHidden\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"/>\n                <category android:name=\"android.intent.category.LAUNCHER\"/>\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n" > app/src/main/AndroidManifest.xml
        
        printf "<resources><string name=\"app_name\">FpsShooter</string></resources>\n" > app/src/main/res/values/strings.xml

        K=app/src/main/kotlin/com/bench/fps
        
        printf "package com.bench.fps\nimport android.app.Activity\nimport android.os.Bundle\nimport android.view.WindowManager\nclass MainActivity : Activity() {\n    private lateinit var view: GameView\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)\n        view = GameView(this)\n        setContentView(view)\n    }\n    override fun onResume() { super.onResume(); view.onResume() }\n    override fun onPause() { view.onPause(); super.onPause() }\n}\n" > $K/MainActivity.kt

        printf "package com.bench.fps\nimport android.content.Context\nimport android.opengl.GLSurfaceView\nimport android.view.MotionEvent\nclass GameView(ctx: Context) : GLSurfaceView(ctx) {\n    val controls = TouchControls()\n    val renderer = GameRenderer(ctx, controls)\n    init {\n        setEGLContextClientVersion(3)\n        preserveEGLContextOnPause = true\n        setRenderer(renderer)\n        renderMode = RENDERMODE_CONTINUOUSLY\n    }\n    override fun onTouchEvent(e: MotionEvent): Boolean {\n        controls.onTouch(e, width.toFloat(), height.toFloat())\n        return true\n    }\n}\n" > $K/GameView.kt

        printf "package com.bench.fps\nimport kotlin.math.cos\nimport kotlin.math.sin\nclass Player {\n    var x = 0f; var y = 1.7f; var z = 0f\n    var yaw = 0f; var pitch = 0f\n    var hp = 100\n    var alive = true\n    fun forward(): FloatArray {\n        val cy = cos(yaw); val sy = sin(yaw)\n        val cp = cos(pitch); val sp = sin(pitch)\n        return floatArrayOf(sy * cp, sp, -cy * cp)\n    }\n    fun takeDamage(d: Int) {\n        hp -= d\n        if (hp <= 0) { hp = 0; alive = false }\n    }\n}\n" > $K/Player.kt

        printf "package com.bench.fps\nclass Enemy {\n    var x = 0f; var z = 0f\n    var alive = true\n    var hpHead = 30\n    var hpTorso = 100\n    var hpLegs = 60\n    var respawnAt = 0L\n    fun zone(hitY: Float): Int = when {\n        hitY > 1.55f -> 0\n        hitY > 0.75f -> 1\n        else -> 2\n    }\n    fun damage(zone: Int, dmg: Int) {\n        when (zone) {\n            0 -> { hpHead -= dmg * 3; if (hpHead <= 0) kill() }\n            1 -> { hpTorso -= dmg; if (hpTorso <= 0) kill() }\n            else -> { hpLegs -= dmg; if (hpLegs <= 0) kill() }\n        }\n    }\n    private fun kill() { alive = false; respawnAt = System.currentTimeMillis() + 4000 }\n}\n" > $K/Enemy.kt

        printf "package com.bench.fps\nimport kotlin.math.sqrt\nimport kotlin.random.Random\nclass World {\n    val enemies = ArrayList<Enemy>()\n    init { repeat(6) { spawn() } }\n    fun spawn() {\n        val e = Enemy()\n        e.x = Random.nextFloat() * 16f - 8f\n        e.z = Random.nextFloat() * 16f - 8f\n        enemies.add(e)\n    }\n    fun respawnTick() {\n        val now = System.currentTimeMillis()\n        for (e in enemies) if (!e.alive && now >= e.respawnAt) {\n            e.alive = true; e.hpHead = 30; e.hpTorso = 100; e.hpLegs = 60\n            e.x = Random.nextFloat() * 16f - 8f\n            e.z = Random.nextFloat() * 16f - 8f\n        }\n    }\n    fun raycast(px: Float, py: Float, pz: Float, dx: Float, dy: Float, dz: Float): Triple<Enemy, Int, Float>? {\n        var best: Triple<Enemy, Int, Float>? = null\n        var bestDist = Float.MAX_VALUE\n        for (e in enemies) {\n            if (!e.alive) continue\n            var t = 0.2f\n            while (t < 40f) {\n                val wx = px + dx * t; val wy = py + dy * t; val wz = pz + dz * t\n                val dxz = sqrt((wx - e.x) * (wx - e.x) + (wz - e.z) * (wz - e.z))\n                if (dxz < 0.35f && wy > 0f && wy < 1.8f) {\n                    if (t < bestDist) { bestDist = t; best = Triple(e, e.zone(wy), t) }\n                    break\n                }\n                t += 0.1f\n            }\n        }\n        return best\n    }\n}\n" > $K/World.kt

        printf "package com.bench.fps\nimport android.opengl.GLES30\nimport java.nio.ByteBuffer\nimport java.nio.ByteOrder\nclass Mesh(vertices: FloatArray) {\n    val vbo: Int\n    val count: Int = vertices.size / 6\n    init {\n        val bb = ByteBuffer.allocateDirect(vertices.size * 4).order(ByteOrder.nativeOrder())\n        val fb = bb.asFloatBuffer(); fb.put(vertices); fb.position(0)\n        val arr = IntArray(1); GLES30.glGenBuffers(1, arr, 0)\n        vbo = arr[0]\n        GLES30.glBindBuffer(GLES30.GL_ARRAY_BUFFER, vbo)\n        GLES30.glBufferData(GLES30.GL_ARRAY_BUFFER, vertices.size * 4, fb, GLES30.GL_STATIC_DRAW)\n    }\n    fun draw() {\n        GLES30.glBindBuffer(GLES30.GL_ARRAY_BUFFER, vbo)\n        GLES30.glEnableVertexAttribArray(0)\n        GLES30.glVertexAttribPointer(0, 3, GLES30.GL_FLOAT, false, 24, 0)\n        GLES30.glEnableVertexAttribArray(1)\n        GLES30.glVertexAttribPointer(1, 3, GLES30.GL_FLOAT, false, 24, 12)\n        GLES30.glDrawArrays(GLES30.GL_TRIANGLES, 0, count)\n    }\n    companion object {\n        fun cube(cx: Float, cy: Float, cz: Float, sx: Float, sy: Float, sz: Float, r: Float, g: Float, b: Float): FloatArray {\n            val hx = sx / 2; val hy = sy / 2; val hz = sz / 2\n            val p = arrayOf(\n                floatArrayOf(cx - hx, cy - hy, cz - hz), floatArrayOf(cx + hx, cy - hy, cz - hz),\n                floatArrayOf(cx + hx, cy + hy, cz - hz), floatArrayOf(cx - hx, cy + hy, cz - hz),\n                floatArrayOf(cx - hx, cy - hy, cz + hz), floatArrayOf(cx + hx, cy - hy, cz + hz),\n                floatArrayOf(cx + hx, cy + hy, cz + hz), floatArrayOf(cx - hx, cy + hy, cz + hz)\n            )\n            val idx = intArrayOf(0,1,2, 0,2,3, 4,6,5, 4,7,6, 0,4,5, 0,5,1, 3,2,6, 3,6,7, 0,3,7, 0,7,4, 1,5,6, 1,6,2)\n            val out = FloatArray(idx.size * 6)\n            var k = 0\n            for (i in idx) {\n                out[k++] = p[i][0]; out[k++] = p[i][1]; out[k++] = p[i][2]\n                out[k++] = r; out[k++] = g; out[k++] = b\n            }\n            return out\n        }\n    }\n}\n" > $K/Mesh.kt

        printf "package com.bench.fps\nobject Shaders {\n    const val VS = \"\"\"#version 300 es\n    layout(location=0) in vec3 aPos;\n    layout(location=1) in vec3 aCol;\n    uniform mat4 uMVP;\n    out vec3 vCol;\n    void main(){ vCol=aCol; gl_Position = uMVP * vec4(aPos,1.0); }\"\"\"\n    const val FS = \"\"\"#version 300 es\n    precision mediump float;\n    in vec3 vCol; out vec4 FragColor;\n    void main(){ FragColor = vec4(vCol,1.0); }\"\"\"\n}\n" > $K/Shaders.kt

        printf "package com.bench.fps\nimport android.view.MotionEvent\nclass TouchControls {\n    var moveX = 0f; var moveY = 0f\n    var lookDX = 0f; var lookDY = 0f\n    var fire = false\n    private var moveId = -1\n    private var lookId = -1\n    private var fireId = -1\n    private var moveCx = 0f; private var moveCy = 0f\n    private var lookPrevX = 0f; private var lookPrevY = 0f\n    fun onTouch(e: MotionEvent, w: Float, h: Float) {\n        when (e.actionMasked) {\n            MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {\n                val i = e.actionIndex\n                val x = e.getX(i); val y = e.getY(i)\n                if (x < w * 0.35f) {\n                    moveId = e.getPointerId(i); moveCx = x; moveCy = y\n                } else if (x > w * 0.75f && y > h * 0.6f) {\n                    fireId = e.getPointerId(i); fire = true\n                } else {\n                    lookId = e.getPointerId(i); lookPrevX = x; lookPrevY = y\n                }\n            }\n            MotionEvent.ACTION_MOVE -> {\n                for (i in 0 until e.pointerCount) {\n                    val id = e.getPointerId(i)\n                    val x = e.getX(i); val y = e.getY(i)\n                    if (id == moveId) {\n                        moveX = ((x - moveCx) / 180f).coerceIn(-1f, 1f)\n                        moveY = ((moveCy - y) / 180f).coerceIn(-1f, 1f)\n                    } else if (id == lookId) {\n                        lookDX += x - lookPrevX\n                        lookDY += y - lookPrevY\n                        lookPrevX = x; lookPrevY = y\n                    }\n                }\n            }\n            MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP, MotionEvent.ACTION_CANCEL -> {\n                val id = e.getPointerId(e.actionIndex)\n                if (id == moveId) { moveId = -1; moveX = 0f; moveY = 0f }\n                if (id == lookId) { lookId = -1; lookDX = 0f; lookDY = 0f }\n                if (id == fireId) { fireId = -1; fire = false }\n            }\n        }\n    }\n    fun consumeLook() { lookDX = 0f; lookDY = 0f }\n}\n" > $K/TouchControls.kt

        printf "package com.bench.fps\nimport android.content.Context\nimport android.opengl.GLES30\nimport android.opengl.GLSurfaceView\nimport android.opengl.Matrix\nimport javax.microedition.khronos.egl.EGLConfig\nimport javax.microedition.khronos.opengles.GL10\nclass GameRenderer(val ctx: Context, val controls: TouchControls) : GLSurfaceView.Renderer {\n    val player = Player()\n    val world = World()\n    private var prog = 0\n    private var uMVP = 0\n    private lateinit var floor: Mesh\n    private lateinit var walls: Array<Mesh>\n    private val proj = FloatArray(16)\n    private val view = FloatArray(16)\n    private val vp = FloatArray(16)\n    private val model = FloatArray(16)\n    private val mvp = FloatArray(16)\n    private var lastFire = 0L\n    override fun onSurfaceCreated(gl: GL10?, cfg: EGLConfig?) {\n        GLES30.glClearColor(0.1f, 0.12f, 0.16f, 1f)\n        GLES30.glEnable(GLES30.GL_DEPTH_TEST)\n        prog = link(Shaders.VS, Shaders.FS)\n        uMVP = GLES30.glGetUniformLocation(prog, \"uMVP\")\n        floor = Mesh(Mesh.cube(0f, -0.05f, 0f, 20f, 0.1f, 20f, 0.25f, 0.28f, 0.22f))\n        walls = arrayOf(\n            Mesh(Mesh.cube(0f, 2f, -10f, 20f, 4f, 0.3f, 0.4f, 0.4f, 0.45f)),\n            Mesh(Mesh.cube(0f, 2f, 10f, 20f, 4f, 0.3f, 0.4f, 0.4f, 0.45f)),\n            Mesh(Mesh.cube(-10f, 2f, 0f, 0.3f, 4f, 20f, 0.4f, 0.4f, 0.45f)),\n            Mesh(Mesh.cube(10f, 2f, 0f, 0.3f, 4f, 20f, 0.4f, 0.4f, 0.45f))\n        )\n    }\n    override fun onSurfaceChanged(gl: GL10?, w: Int, h: Int) {\n        GLES30.glViewport(0, 0, w, h)\n        val aspect = w.toFloat() / h\n        Matrix.perspectiveM(proj, 0, 70f, aspect, 0.1f, 100f)\n    }\n    override fun onDrawFrame(gl: GL10?) {\n        val now = System.currentTimeMillis()\n        world.respawnTick()\n        updateMovement()\n        updateFire(now)\n        GLES30.glClear(GLES30.GL_COLOR_BUFFER_BIT or GLES30.GL_DEPTH_BUFFER_BIT)\n        setupCamera()\n        GLES30.glUseProgram(prog)\n        floor.draw()\n        for (w in walls) w.draw()\n        for (e in world.enemies) if (e.alive) drawEnemy(e)\n    }\n    private fun updateMovement() {\n        val sp = 0.12f\n        val fx = Math.sin(player.yaw.toDouble()).toFloat()\n        val fz = -Math.cos(player.yaw.toDouble()).toFloat()\n        val rx = Math.cos(player.yaw.toDouble()).toFloat()\n        val rz = Math.sin(player.yaw.toDouble()).toFloat()\n        player.x += (fx * controls.moveY + rx * controls.moveX) * sp\n        player.z += (fz * controls.moveY + rz * controls.moveX) * sp\n        player.yaw += controls.lookDX * 0.003f\n        player.pitch -= controls.lookDY * 0.003f\n        player.pitch = player.pitch.coerceIn(-1.2f, 1.2f)\n        controls.consumeLook()\n    }\n    private fun updateFire(now: Long) {\n        if (controls.fire && now - lastFire > 120) {\n            lastFire = now\n            val f = player.forward()\n            val hit = world.raycast(player.x, player.y, player.z, f[0], f[1], f[2])\n            if (hit != null) {\n                val (e, zone, _) = hit\n                e.damage(zone, 25)\n            }\n        }\n    }\n    private fun setupCamera() {\n        val f = player.forward()\n        Matrix.setLookAtM(view, 0,\n            player.x, player.y, player.z,\n            player.x + f[0], player.y + f[1], player.z + f[2],\n            0f, 1f, 0f)\n        Matrix.multiplyMM(vp, 0, proj, 0, view, 0)\n    }\n    private fun drawEnemy(e: Enemy) {\n        val parts = arrayOf(\n            Mesh.cube(e.x, 1.65f, e.z, 0.22f, 0.22f, 0.22f, 0.85f, 0.7f, 0.6f),\n            Mesh.cube(e.x, 1.15f, e.z, 0.45f, 0.7f, 0.25f, 0.3f, 0.45f, 0.8f),\n            Mesh.cube(e.x - 0.12f, 0.4f, e.z, 0.18f, 0.8f, 0.2f, 0.2f, 0.25f, 0.35f),\n            Mesh.cube(e.x + 0.12f, 0.4f, e.z, 0.18f, 0.8f, 0.2f, 0.2f, 0.25f, 0.35f)\n        )\n        for (m in parts) {\n            Matrix.setIdentityM(model, 0)\n            Matrix.multiplyMM(mvp, 0, vp, 0, model, 0)\n            GLES30.glUniformMatrix4fv(uMVP, 1, false, mvp, 0)\n            m.draw()\n        }\n    }\n    private fun link(vs: String, fs: String): Int {\n        val v = GLES30.glCreateShader(GLES30.GL_VERTEX_SHADER)\n        GLES30.glShaderSource(v, vs); GLES30.glCompileShader(v)\n        val f = GLES30.glCreateShader(GLES30.GL_FRAGMENT_SHADER)\n        GLES30.glShaderSource(f, fs); GLES30.glCompileShader(f)\n        val p = GLES30.glCreateProgram()\n        GLES30.glAttachShader(p, v); GLES30.glAttachShader(p, f); GLES30.glLinkProgram(p)\n        return p\n    }\n}\n" > $K/GameRenderer.kt
        
        gradle wrapper --gradle-version 8.7
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FpsShooter-APK
        path: app/build/outputs/apk/debug/app-debug.apk
